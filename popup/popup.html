<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=420" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1>App Metrics Harvester</h1>
      <span class="header-sub">Сбор статистики для LLM-анализа</span>
    </header>

    <!-- Секция: Приложения -->
    <section class="section">
      <div class="section-header">
        <h2>Приложения</h2>
        <button id="btn-add" class="btn btn-sm btn-accent" title="Добавить приложение">+ Добавить</button>
        <button id="btn-scan-rustore" class="btn btn-sm btn-ghost" title="Загрузить все приложения из RuStore Console">🔄 Из RuStore</button>
      </div>

      <!-- Форма добавления (скрыта по умолчанию) -->
      <div id="add-form" class="add-form hidden">
        <input id="f-name" type="text" placeholder="Название (напр. Мой калькулятор)" />
        <select id="f-platform">
          <option value="rustore">RuStore</option>
          <option value="googleplay">Google Play Console</option>
          <option value="rsya">РСЯ (Yandex Ads)</option>
        </select>
        <input id="f-appid" type="text" placeholder="App ID (напр. 2063711093)" />
        <input
          id="f-url"
          type="text"
          placeholder="URL статистики (автозаполнение)"
        />
        <div class="form-actions">
          <button id="btn-save-app" class="btn btn-sm btn-primary">Сохранить</button>
          <button id="btn-cancel-add" class="btn btn-sm btn-ghost">Отмена</button>
        </div>
      </div>

      <!-- Список приложений -->
      <div id="app-list" class="app-list">
        <p class="empty-state">Нет добавленных приложений</p>
      </div>
    </section>

    <!-- Секция: Сбор данных -->
    <section class="section">
      <div class="section-header">
        <h2>Сбор данных</h2>
      </div>
      <div class="collect-row">
        <button id="btn-collect-all" class="btn btn-primary">
          Собрать все данные
        </button>
        <button id="btn-collect-current" class="btn btn-ghost btn-sm" title="Собрать с текущей открытой страницы">
          С текущей страницы
        </button>
      </div>
      <div id="status-bar" class="status-bar hidden"></div>
    </section>

    <!-- Секция: Данные и экспорт -->
    <section class="section">
      <div class="section-header">
        <h2>Собранные данные</h2>
        <div>
          <button id="btn-export" class="btn btn-sm btn-accent" disabled>Копировать Markdown</button>
          <button id="btn-clear" class="btn btn-sm btn-danger" disabled>Очистить</button>
        </div>
      </div>
      <div id="data-summary" class="data-summary">
        <p class="empty-state">Данные появятся после сбора</p>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
