<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=420" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1>App Metrics Harvester</h1>
        <span class="header-sub">Сбор статистики для LLM-анализа</span>
      </div>
      <div class="header-btns">
        <button id="btn-manage-apps" class="btn-icon-header" title="Управление приложениями">⚙️</button>
        <button id="btn-dashboard" class="btn-icon-header" title="Открыть полный дашборд">📊</button>
      </div>
    </header>

    <!-- Секция: Приложения (read-only) -->
    <section class="section">
      <div class="section-header">
        <h2>Приложения <span id="app-count" class="app-count"></span></h2>
        <button id="btn-scan-rustore" class="btn btn-sm btn-ghost" title="Загрузить все приложения из RuStore Console">🔄 Из RuStore</button>
        <button id="btn-scan-googleplay" class="btn btn-sm btn-ghost" title="Загрузить закреплённые приложения из Google Play Console">📱 Из Google Play</button>
      </div>
      <div id="app-list" class="app-list">
        <p class="empty-state">Нет добавленных приложений</p>
      </div>
    </section>

    <!-- Секция: Сбор данных -->
    <section class="section">
      <div class="section-header">
        <h2>Сбор данных</h2>
      </div>
      <div class="collect-row">
        <button id="btn-collect-all" class="btn btn-primary">
          Собрать все данные
        </button>
        <button id="btn-collect-current" class="btn btn-ghost btn-sm" title="Собрать с текущей открытой страницы">
          С текущей страницы
        </button>
      </div>
      <div id="status-bar" class="status-bar hidden"></div>
    </section>

    <!-- Секция: РСЯ API -->
    <section class="section rsya-section">
      <div class="section-header">
        <h2>РСЯ API</h2>
        <button id="btn-test-rsya" class="btn btn-sm btn-ghost" title="Тестировать доступ к РСЯ API">Тест</button>
      </div>
      <div class="rsya-api-info">
        <p id="rsya-status" class="rsya-status">Не проверено</p>
      </div>
      <div class="rsya-token-row">
        <input id="f-rsya-token" type="text" placeholder="OAuth-токен (если нужен)" class="token-input" />
        <button id="btn-save-token" class="btn btn-sm btn-ghost">Сохранить</button>
      </div>
    </section>

    <!-- Секция: Данные и экспорт -->
    <section class="section">
      <div class="section-header">
        <h2>Собранные данные</h2>
        <div>
          <button id="btn-export" class="btn btn-sm btn-accent" disabled>Копировать Markdown</button>
          <button id="btn-clear" class="btn btn-sm btn-danger" disabled>Очистить</button>
        </div>
      </div>
      <div id="data-summary" class="data-summary">
        <p class="empty-state">Данные появятся после сбора</p>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
